spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:framework_tutor}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET:?JWT_SECRET must be a Base64-encoded secret of at least 32 bytes}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
