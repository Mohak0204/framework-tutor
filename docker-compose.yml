services:
  postgres:
    image: postgres:16
    container_name: framework-tutor-postgres
    environment:
      POSTGRES_DB: framework_tutor
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env or your shell environment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or your shell environment}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
